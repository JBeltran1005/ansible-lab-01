---
- name: Configure web server
  hosts: webserver
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Install dig
      ansible.builtin.apt:
        name: dnsutils
        state: present

    - name: Install Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present

    - name: Start and enable Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Deploy corporate custom index page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        mode: "0644"
        content: |
          <!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Ejercicio 01 - Ansible & GitHub</title>
              <style>
                  * {
                      box-sizing: border-box;
                      margin: 0;
                      padding: 0;
                      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                  }
                  body {
                      background-color: #0f172a;
                      color: #f8fafc;
                      display: flex;
                      justify-content: center;
                      align-items: center;
                      min-height: 100vh;
                      padding: 20px;
                  }
                  .card {
                      background: #1e293b;
                      border: 1px solid #334155;
                      border-radius: 16px;
                      max-width: 650px;
                      width: 100%;
                      padding: 40px;
                      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
                  }
                  .badge {
                      display: inline-block;
                      background: #0284c7;
                      color: #ffffff;
                      font-size: 0.75rem;
                      font-weight: 700;
                      letter-spacing: 0.05em;
                      text-transform: uppercase;
                      padding: 6px 14px;
                      border-radius: 9999px;
                      margin-bottom: 20px;
                  }
                  h1 {
                      font-size: 1.4rem;
                      font-weight: 700;
                      color: #f1f5f9;
                      margin-bottom: 12px;
                      word-break: break-word;
                  }
                  .subtitle {
                      font-size: 1.1rem;
                      color: #38bdf8;
                      font-weight: 500;
                      margin-bottom: 24px;
                      display: flex;
                      align-items: center;
                      gap: 8px;
                  }
                  .status-dot {
                      width: 10px;
                      height: 10px;
                      background-color: #22c55e;
                      border-radius: 50%;
                      display: inline-block;
                      box-shadow: 0 0 10px #22c55e;
                  }
                  .divider {
                      height: 1px;
                      background-color: #334155;
                      margin: 24px 0;
                  }
                  .info-grid {
                      display: grid;
                      gap: 16px;
                  }
                  .info-item {
                      display: flex;
                      justify-content: space-between;
                      background: #0f172a;
                      padding: 14px 18px;
                      border-radius: 8px;
                      border: 1px solid #1e293b;
                  }
                  .info-label {
                      color: #94a3b8;
                      font-size: 0.9rem;
                  }
                  .info-value {
                      color: #f8fafc;
                      font-weight: 600;
                      font-size: 0.95rem;
                  }
              </style>
          </head>
          <body>
              <div class="card">
                  <span class="badge">Infraestructura Automatizada</span>
                  <h1>Ejercicio_01_Primer_Proyecto_Ansible_GitHub_Actualizad</h1>
                  <div class="subtitle">
                      <span class="status-dot"></span>
                      Servidor Web Nginx funcionando con Ansible
                  </div>
                  <div class="divider"></div>
                  <div class="info-grid">
                      <div class="info-item">
                          <span class="info-label">Integrante:</span>
                          <span class="info-value">Juan Beltran</span>
                      </div>
                      <div class="info-item">
                          <span class="info-label">Servicio Web:</span>
                          <span class="info-value">Nginx / Ubuntu</span>
                      </div>
                      <div class="info-item">
                          <span class="info-label">Aprovisionamiento:</span>
                          <span class="info-value">Ansible Automation Platform</span>
                      </div>
                  </div>
              </div>
          </body>
          </html>
